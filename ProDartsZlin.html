<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pro Darts Zlín</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; height: 100dvh; margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        .hidden { display: none !important; }
        
        #menu-screen { background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100dvh; width: 100%; position: absolute; top: 0; left: 0; z-index: 100; }
        .btn-local { background: linear-gradient(145deg, #16a34a, #15803d); padding: 1.2rem 3rem; border-radius: 1rem; color: white; font-weight: 900; font-size: 1.5rem; text-transform: uppercase; box-shadow: 0 8px 0 #064e3b, 0 15px 25px rgba(0,0,0,0.4); transition: all 0.1s; cursor: pointer; }
        .btn-local:active { transform: translateY(4px); box-shadow: 0 2px 0 #064e3b; }

        .btn { background: #1e293b; border-radius: 12px; color: white; font-size: 1.8rem; font-weight: 900; display: flex; align-items: center; justify-content: center; height: 65px; box-shadow: 0 4px 0 #000; touch-action: manipulation; }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; background-color: #334155; }
        .btn-enter { background: #16a34a; box-shadow: 0 4px 0 #064e3b; grid-row: span 2; height: auto; }
        .btn-util { background: #334155; font-size: 1rem; color: #94a3b8; }

        .overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); z-index: 200; align-items: center; justify-content: center; }
        .overlay-card { background: #1e293b; padding: 2rem; border-radius: 2rem; border: 1px solid #334155; text-align: center; width: 85%; max-width: 350px; }
    </style>
</head>
<body>

    <div id="menu-screen">
        <div class="text-center mb-12">
            <h1 class="text-emerald-500 font-black text-3xl tracking-tighter uppercase italic opacity-80 leading-none">Pro Darts</h1>
            <h2 class="text-white font-black text-6xl tracking-widest uppercase">Zlín</h2>
        </div>
        <button onclick="showGame()" class="btn-local">Local Game</button>
    </div>

    <div id="game-screen" class="hidden flex flex-col h-full w-full absolute inset-0">
        
        <div id="finish-overlay" class="overlay"><div class="overlay-card"><h2 class="text-xl font-black text-white mb-6 uppercase tracking-widest">Zavřeno!</h2><div id="dart-buttons" class="grid grid-cols-1 gap-4"></div></div></div>
        <div id="winner-overlay" class="overlay"><div class="overlay-card"><span class="text-5xl">🏆</span><h2 class="text-3xl font-black text-white mt-4 uppercase italic">Vítěz!</h2><p id="final-stats" class="text-slate-400 mt-2 font-mono text-sm mb-6"></p><div class="flex flex-col gap-3"><button onclick="resetGame(); hideOverlays();" class="bg-emerald-600 py-4 rounded-xl text-white font-black uppercase">Nová hra</button><button onclick="goToMenu()" class="bg-slate-700 py-4 rounded-xl text-white font-black uppercase">Menu</button></div></div></div>
        <div id="exit-overlay" class="overlay"><div class="overlay-card"><h2 class="text-xl font-black text-white mb-2 uppercase">Opustit hru?</h2><p class="text-slate-400 text-sm mb-8">Aktuální zápas bude ztracen.</p><div class="flex flex-col gap-3"><button onclick="goToMenu()" class="bg-rose-600 py-4 rounded-xl text-white font-black uppercase">Ano, odejít</button><button onclick="hideOverlays()" class="bg-slate-700 py-4 rounded-xl text-white font-black uppercase">Zrušit</button></div></div></div>

        <div class="bg-slate-900 pt-10 pb-4 px-6 border-b border-slate-800 shrink-0">
            <div class="flex justify-between items-start">
                <div>
                    <span class="text-[10px] text-emerald-500 font-black tracking-widest uppercase italic">Skóre</span>
                    <div id="main-score" class="text-7xl font-digital text-white leading-none">501</div>
                </div>
                <div class="text-right">
                    <div id="darts-stat" class="text-slate-500 font-bold text-sm">Šipky: 0</div>
                    <div id="avg-stat" class="text-emerald-400 font-digital text-xs">Ø 0.0</div>
                    <button onclick="showExitConfirm()" class="mt-4 text-[9px] border border-slate-700 text-slate-500 px-3 py-1 rounded-full uppercase font-bold">Menu</button>
                </div>
            </div>
            <div id="checkout-guide" class="mt-4 p-3 bg-slate-800/50 border border-slate-700 rounded-xl text-emerald-400 text-center font-bold text-lg min-h-[52px] flex items-center justify-center italic">
                - - -
            </div>
        </div>

        <div id="history-container" class="flex-grow overflow-y-auto">
            <div id="history-body" class="divide-y divide-slate-800/50"></div>
        </div>

        <div class="bg-slate-900/90 p-4 flex justify-between items-center border-t border-slate-800 shrink-0">
            <span class="text-orange-500 font-black italic text-sm">HOD:</span>
            <div id="buffer" class="text-5xl font-digital text-orange-400 min-h-[50px]"></div>
        </div>

        <div class="grid grid-cols-4 gap-3 p-4 bg-slate-900 shrink-0">
            <button onclick="press(1)" class="btn">1</button><button onclick="press(2)" class="btn">2</button><button onclick="press(3)" class="btn">3</button><button onclick="backspace()" class="btn btn-util">←</button>
            <button onclick="press(4)" class="btn">4</button><button onclick="press(5)" class="btn">5</button><button onclick="press(6)" class="btn">6</button><button onclick="undo()" class="btn btn-util text-[10px] uppercase font-black">Zpět</button>
            <button onclick="press(7)" class="btn">7</button><button onclick="press(8)" class="btn">8</button><button onclick="press(9)" class="btn">9</button><button onclick="submit()" class="btn btn-enter">OK</button>
            <button onclick="press(0)" class="btn col-span-3">0</button>
        </div>
    </div>

    <script>
        let score = 501;
        let history = [];
        let buffer = "";
        
        const checkouts = {
            170: "T20 T20 BULL", 167: "T20 T19 BULL", 164: "T20 T18 BULL", 161: "T20 T17 BULL", 160: "T20 T20 D20", 158: "T20 T20 D19", 157: "T20 T19 D20", 156: "T20 T20 D18", 155: "T20 T19 D19", 154: "T20 T18 D20", 153: "T20 T19 D18", 152: "T20 T20 D16", 151: "T20 T17 D20", 150: "T20 T18 D18", 149: "T20 T19 D16", 148: "T20 T16 D20", 147: "T20 T17 D18", 146: "T20 T18 D16", 145: "T20 T15 D20", 144: "T20 T20 D12", 143: "T20 T17 D16", 142: "T20 T14 D20", 141: "T20 T15 D18", 140: "T20 T16 D16", 138: "T20 T18 D12", 135: "T20 T13 D18", 132: "T20 T16 D12", 130: "T20 T18 D8", 121: "T20 T15 D8", 110: "T20 S10 D20", 100: "T20 D20", 94: "T18 D20", 83: "T17 D16", 82: "T14 D20", 81: "T19 D12", 80: "T20 D10", 72: "T12 D18", 64: "D16 D16", 60: "S20 D20", 50: "S10 D20", 40: "D20"
        };

        function showGame() { document.getElementById('menu-screen').style.display = 'none'; document.getElementById('game-screen').classList.remove('hidden'); resetGame(); }
        function showExitConfirm() { document.getElementById('exit-overlay').style.display = 'flex'; }
        function goToMenu() { hideOverlays(); document.getElementById('game-screen').classList.add('hidden'); document.getElementById('menu-screen').style.display = 'flex'; }
        function hideOverlays() { document.getElementById('finish-overlay').style.display = 'none'; document.getElementById('winner-overlay').style.display = 'none'; document.getElementById('exit-overlay').style.display = 'none'; }
        function press(n) { if (buffer.length < 3) { buffer += n; if (parseInt(buffer) > 180) buffer = "180"; document.getElementById('buffer').innerText = buffer; } }
        function backspace() { buffer = buffer.slice(0, -1); document.getElementById('buffer').innerText = buffer; }

        function submit() {
            const val = parseInt(buffer) || 0;
            if (score - val < 0 || score - val === 1) {
                alert("BUST!");
            } else {
                let currentScore = score;
                score -= val;
                if (score === 0) {
                    // AUTOMATIKA: Pokud je hodnota zavření vysoká, rovnou ukonči hru
                    if (currentScore > 110) {
                        showWinnerMenu(3); // Automaticky 3. šipka
                    } else {
                        showFinishOverlay(currentScore);
                    }
                } else {
                    history.push({ thrown: val, remaining: score });
                }
            }
            buffer = "";
            document.getElementById('buffer').innerText = "";
            updateUI();
        }

        function showFinishOverlay(lastScore) {
            const overlay = document.getElementById('finish-overlay');
            const btnContainer = document.getElementById('dart-buttons');
            btnContainer.innerHTML = '';
            
            // Logika nabízených tlačítek podle výšky zavíraného čísla
            let startFrom = lastScore > 110 ? 3 : (lastScore > 60 ? 2 : 1);
            
            for (let i = startFrom; i <= 3; i++) {
                const b = document.createElement('button');
                b.className = "bg-emerald-600 py-4 rounded-xl font-black text-white active:scale-95 text-lg";
                b.innerText = `${i}. ŠIPKOU`;
                b.onclick = () => showWinnerMenu(i);
                btnContainer.appendChild(b);
            }
            overlay.style.display = 'flex';
        }

        function showFinishOverlay(lastScore) {
            const overlay = document.getElementById('finish-overlay');
            const btnContainer = document.getElementById('dart-buttons');
            btnContainer.innerHTML = '';
            let startFrom = lastScore > 120 ? 3 : (lastScore > 60 ? 2 : 1);
            for (let i = startFrom; i <= 3; i++) {
                const b = document.createElement('button');
                b.className = "bg-emerald-600 py-4 rounded-xl font-black text-white active:scale-95 text-lg";
                b.innerText = `${i}. ŠIPKOU`;
                b.onclick = () => showWinnerMenu(i);
                btnContainer.appendChild(b);
            }
            overlay.style.display = 'flex';
        }

        function showWinnerMenu(lastDart) {
            document.getElementById('finish-overlay').style.display = 'none';
            const totalDarts = (history.length * 3) + lastDart;
            const avg = history.length > 0 ? (501 / (totalDarts / 3)).toFixed(1) : "0.0";
            document.getElementById('final-stats').innerText = `Šipky: ${totalDarts} | Průměr: ${avg}`;
            document.getElementById('winner-overlay').style.display = 'flex';
        }

        function updateUI() {
            document.getElementById('main-score').innerText = score;
            const guide = document.getElementById('checkout-guide');
            const bogeys = [169, 168, 166, 165, 163, 162, 159];

            if (score <= 170) {
                if (bogeys.includes(score)) {
                    guide.innerText = "NELZE";
                    guide.style.color = "#ef4444";
                } else if (checkouts[score]) {
                    guide.innerText = checkouts[score];
                    guide.style.color = "#34d399";
                } else {
                    // DYNAMICKÁ NÁPOVĚDA PRO ZBYTEK
                    if (score <= 40) {
                        if (score % 2 === 0) guide.innerText = "D" + (score / 2);
                        else guide.innerText = "S1 D" + ((score - 1) / 2);
                    } else if (score <= 60) {
                        guide.innerText = "S" + (score - 40) + " D20";
                    } else {
                        guide.innerText = "ZAVÍREJ!";
                    }
                    guide.style.color = "#34d399";
                }
            } else {
                guide.innerText = "- - -";
                guide.style.color = "#94a3b8";
            }

            document.getElementById('darts-stat').innerText = `Šipky: ${history.length * 3}`;
            const total = history.reduce((a, b) => a + b.thrown, 0);
            const avg = history.length > 0 ? (total / history.length).toFixed(1) : "0.0";
            document.getElementById('avg-stat').innerText = `Ø ${avg}`;
            const historyBody = document.getElementById('history-body');
            historyBody.innerHTML = history.slice().reverse().map((r, i) => `
                <div class="flex justify-between p-4 bg-slate-900/20 border-b border-slate-800/30">
                    <span class="text-slate-600 font-bold text-xs">${history.length - i}.</span>
                    <span class="text-orange-400 font-digital font-bold">-${r.thrown}</span>
                    <span class="text-emerald-400 font-digital text-xl">${r.remaining}</span>
                </div>
            `).join('');
        }

        function undo() {
            if (buffer !== "") { buffer = ""; document.getElementById('buffer').innerText = ""; } 
            else if (history.length > 0) { const lastTurn = history.pop(); score += lastTurn.thrown; buffer = lastTurn.thrown.toString(); document.getElementById('buffer').innerText = buffer; }
            updateUI();
        }

        function resetGame() { score = 501; history = []; buffer = ""; updateUI(); }
    </script>
</body>
</html>
